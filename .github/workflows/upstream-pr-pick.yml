# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: upstream-pr-pick

# NOTE: Commits are matched by the "(cherry picked from commit ...)" trailer that git cherry-pick -x writes, so rebased copies still count as present.
# NOTE: Pushes made with GITHUB_TOKEN do not trigger the build workflow.
# NOTE: Runs regardless of the upstream PR state, so delete this workflow when the fork is retired.
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

env:
  UPSTREAM_REPO: charmbracelet/fantasy
  UPSTREAM_PR: "407"

permissions:
  contents: write

concurrency:
  group: upstream-pr-pick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Cherry-pick missing upstream commits
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            "+refs/pull/${UPSTREAM_PR}/head:refs/remotes/upstream/pr-${UPSTREAM_PR}"

          # NOTE: The PR commit list comes from the API because diffing against upstream main is empty once the PR is merged.
          commits=$(gh api --paginate "repos/${UPSTREAM_REPO}/pulls/${UPSTREAM_PR}/commits" --jq '.[].sha')
          if [ -z "$commits" ]; then
            echo "::error title=No commits::The API returned no commits for ${UPSTREAM_REPO}#${UPSTREAM_PR}."
            exit 1
          fi

          missing=()
          for sha in $commits; do
            if git merge-base --is-ancestor "$sha" HEAD; then
              continue
            fi
            if [ -n "$(git log -1 --format=%H --fixed-strings --grep="(cherry picked from commit ${sha})" HEAD)" ]; then
              continue
            fi
            missing+=("$sha")
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All commits of ${UPSTREAM_REPO}#${UPSTREAM_PR} are already present."
            exit 0
          fi

          echo "Missing ${#missing[@]} commit(s):"
          git log --no-walk=unsorted --oneline "${missing[@]}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git cherry-pick -x "${missing[@]}"; then
            git cherry-pick --abort || true
            echo "::error title=Cherry-pick failed::Could not apply ${UPSTREAM_REPO}#${UPSTREAM_PR} cleanly. Resolve it by hand."
            exit 1
          fi

          echo "picked=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.pick.outputs.picked == 'true'
        with:
          go-version-file: ./go.mod

      - name: Build and test before pushing
        if: steps.pick.outputs.picked == 'true'
        run: |
          go build ./...
          go test ./... -count=1 -timeout=30m

      - name: Push
        if: steps.pick.outputs.picked == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
